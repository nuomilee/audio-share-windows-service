# AudioShareServer 服务配置
# 修改后需重启服务: Restart-Service AudioShareServer
# 若路径含空格，请使用绝对路径，例如 exe=C:\Services\audio-share\as-cmd.exe
#
# 监听程序（相对本目录）
exe=as-cmd.exe
# 传给 as-cmd.exe 的参数。0.0.0.0 表示所有网卡，IP 变化也不受影响；
# 只想监听某块网卡可改成 --bind=192.168.1.100
# --discovery 让手机 App 自动发现本机（UDP 65531）
args=--bind=0.0.0.0 --discovery
# 工作目录（相对本目录）
workdir=.
# 日志目录（相对本目录），每天一个 as-cmd-yyyyMMdd.log
logdir=logs
# 日志保留天数（含当天）
retaindays=7
